# Single source of truth for toolchain, plugin and library versions.
# Every version is pinned exactly; no dynamic or range versions are allowed here.
[versions]
# Android SDK levels and build tools used by the application module.
android-compileSdk = "36"
android-targetSdk = "36"
# Provisional scaffold baseline; the architecture ticket (android#2) confirms or raises it.
android-minSdk = "26"
android-buildTools = "36.0.0"

# Build plugins.
agp = "9.4.1"
kotlin = "2.4.20"
spotless = "8.10.3"
ktlint = "1.8.0"

# AndroidX and Compose.
# BOM 2026.06.01 = Compose 1.11.4 / Material 3 1.4.0, the newest line whose minCompileSdk (35) fits
# compileSdk 36. Compose 1.12 (BOM 2026.08.00+) requires compileSdk 37; move both together.
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
# Pinned to the version the Compose BOM and activity already resolve, so declaring it adds no bump.
androidx-core = "1.18.0"
# Background work: WorkManager exposes JobScheduler stop reasons through WorkInfo/ListenableWorker.
androidx-work = "2.12.0"
# Play Integrity API client (standard requests); the adapter is behind an interface and never called in tests.
play-integrity = "1.6.0"
# Coroutines test dispatcher; pinned to the kotlinx-coroutines line Compose already resolves.
kotlinx-coroutines = "1.9.0"

# Unit testing (JVM). Robolectric 4.17 is the current release; it runs the Android 16 (SDK 36) runtime
# by default here and the SDK 31/33/35 runtimes for the API-level matrix test. The Compose UI test
# artifacts come from the Compose BOM above.
junit4 = "4.13.2"
robolectric = "4.17"
# JSON reader for the machine-readable platform documents the unit tests cross-check against code.
gson = "2.14.0"

# Instrumented testing (androidTest, run locally on the API 36 emulator; CI has no emulator).
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
