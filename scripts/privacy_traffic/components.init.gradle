import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(":app")
    app.tasks.register("privacyComponentInventory") {
        doLast {
            def variants = [:]
            ["debug", "release"].each { variant ->
                def configuration = app.configurations.getByName("${variant}RuntimeClasspath")
                variants[variant] = configuration.incoming.resolutionResult.allComponents
                    .collect { it.id }
                    .findAll { it instanceof ModuleComponentIdentifier }
                    .collect { "${it.group}:${it.module}:${it.version}".toString() }
                    .sort()
            }
            println("PRIVACY_COMPONENT_INVENTORY " + JsonOutput.toJson([
                schema_version: 1,
                variants: variants,
            ]))
        }
    }
}
