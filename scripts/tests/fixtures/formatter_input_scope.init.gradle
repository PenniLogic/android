import groovy.json.JsonOutput
import java.nio.file.Files
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.FileCollection
import org.gradle.api.file.FileTree
import org.gradle.api.file.FileVisitDetails
import org.gradle.api.file.FileVisitor
import org.gradle.api.internal.file.SubtractingFileCollection

gradle.projectsEvaluated {
    def project = gradle.rootProject
    def target = project.tasks.named("spotlessKotlin").get().getTarget()
    def sourceRoot = project.file("app").toPath().resolve("src").toAbsolutePath().normalize()
    def expected = project.fileTree(sourceRoot.toFile()) { include("**/*.kt") }.files
    def appBuild = project.project(":app").layout.buildDirectory.get().asFile.toPath()
    def rootBuild = project.layout.buildDirectory.get().asFile.toPath()
    def blameRoot = appBuild
        .resolve("intermediates")
        .resolve("merged_res_blame_folder")
        .resolve("debug")
        .resolve("mergeDebugResources")
        .resolve("out")
        .resolve("multi-v2")

    project.tasks.register("formatterInputScopeRegression") {
        doLast {
            def stages = []
            def generated = null
            def outsideSource = null
            def probeNames = ["Generated.kt", "Changed.kt", "Renamed.kt"]
            def checkout = project.projectDir.toPath().toAbsolutePath().normalize()
            def testsRoot = project.file("scripts").toPath().resolve("tests")
            [blameRoot, testsRoot].each { parent ->
                def existing = parent.toAbsolutePath().normalize()
                if (!existing.startsWith(checkout)) {
                    throw new GradleException("Formatter fixture parent is outside the checkout")
                }
                while (!Files.exists(existing)) {
                    existing = existing.parent
                }
                if (!existing.toRealPath().startsWith(checkout.toRealPath())) {
                    throw new GradleException("Formatter fixture parent resolves outside the checkout")
                }
            }
            try {
                Files.createDirectories(blameRoot)
                generated = Files.createTempDirectory(blameRoot, "formatter-input-scope-")
                outsideSource = Files.createTempDirectory(testsRoot, "formatter-input-scope-")
                Files.writeString(outsideSource.resolve("OutsideSource.kt"), "object OutsideSource\n")
                Files.writeString(generated.resolve("Generated.kt"), "object Generated\n")

                def snapshot = { String name ->
                    def generatedVisited = [] as Set
                    def outsideVisited = [] as Set
                    def visitScope
                    visitScope = { FileCollection collection ->
                        // Subtraction enumerates BOTH operands, even when its final files are source-only.
                        if (collection instanceof SubtractingFileCollection) {
                            visitScope(collection.getLeft())
                            visitScope(collection.getRight())
                        } else if (collection instanceof FileTree) {
                            collection.visit(new FileVisitor() {
                                void visitDir(FileVisitDetails details) {
                                    def path = details.file.toPath().toAbsolutePath().normalize()
                                    if (path.startsWith(appBuild) || path.startsWith(rootBuild)) {
                                        generatedVisited.add(path.toString())
                                    }
                                }

                                void visitFile(FileVisitDetails details) {
                                    def path = details.file.toPath().toAbsolutePath().normalize()
                                    if (path.startsWith(appBuild) || path.startsWith(rootBuild)) {
                                        generatedVisited.add(path.toString())
                                    }
                                    if (!path.startsWith(sourceRoot) || !details.file.name.endsWith(".kt")) {
                                        outsideVisited.add(path.toString())
                                    }
                                }
                            })
                        } else if (collection instanceof ConfigurableFileCollection) {
                            collection.getFrom().each { entry ->
                                if (!(entry instanceof FileCollection)) {
                                    throw new GradleException("Unknown formatter input entry: " + entry.getClass().name)
                                }
                                visitScope(entry)
                            }
                        } else {
                            throw new GradleException("Unknown formatter input collection: " + collection.getClass().name)
                        }
                    }
                    visitScope(target)
                    def inputs = target.files
                    stages.add([
                        stage: name,
                        source_files: inputs.size(),
                        source_set_matches: inputs == expected && !expected.isEmpty(),
                        generated_entries_visited: generatedVisited.size(),
                        non_source_entries_visited: outsideVisited.size(),
                    ])
                }

                snapshot("created")
                Files.writeString(generated.resolve("Generated.kt"), "object ChangedGenerated\n")
                Files.writeString(generated.resolve("Changed.kt"), "object Changed\n")
                snapshot("modified")
                Files.move(generated.resolve("Generated.kt"), generated.resolve("Renamed.kt"))
                snapshot("renamed")
                probeNames.each { Files.deleteIfExists(generated.resolve(it)) }
                snapshot("files_deleted")
                Files.delete(generated)
                snapshot("directory_deleted")
            } finally {
                if (generated != null) {
                    probeNames.each { Files.deleteIfExists(generated.resolve(it)) }
                    Files.deleteIfExists(generated)
                }
                if (outsideSource != null) {
                    Files.deleteIfExists(outsideSource.resolve("OutsideSource.kt"))
                    Files.deleteIfExists(outsideSource)
                }
            }
            def passed = stages.size() == 5 && stages.every {
                it.source_set_matches && it.generated_entries_visited == 0 && it.non_source_entries_visited == 0
            }
            println("FORMATTER_INPUT_SCOPE " + JsonOutput.toJson([
                passed: passed,
                expected_source_files: expected.size(),
                stages: stages,
                generated_fixture_removed: generated != null && !Files.exists(generated),
                outside_source_fixture_removed: outsideSource != null && !Files.exists(outsideSource),
            ]))
            if (!passed) {
                throw new GradleException("Formatter input collection traversed generated/non-source paths or lost Kotlin sources")
            }
        }
    }
}
