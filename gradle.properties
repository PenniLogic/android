# Gradle daemon and build behaviour. Toolchain versions live in gradle/libs.versions.toml;
# the required JDK is declared in gradle/gradle-daemon-jvm.properties.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android Gradle plugin behaviour.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Run unit tests for the release variant too, so the release BuildConfig contract is verified.
android.onlyEnableUnitTestForTheTestedBuildType=false

# Kotlin.
kotlin.code.style=official
