{
  "name": "CI",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "ci": {
      "name": "CI",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "JDK",
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "name": "Android SDK packages",
          "run": "sdk=\"${ANDROID_HOME:?ANDROID_HOME is not set on this runner}\"\nmanager=\"$sdk/cmdline-tools/latest/bin/sdkmanager\"\nmissing=\"\"\nfor package in \"platforms;android-36\" \"build-tools;36.0.0\" \"platform-tools\"; do\n  [ -d \"$sdk/${package//;//}\" ] || missing=\"$missing $package\"\ndone\nif [ -n \"$missing\" ]; then\n  echo \"Installing missing Android SDK packages:$missing\"\n  yes | \"$manager\" --licenses > /dev/null || true\n  \"$manager\" --install $missing\nelse\n  echo \"Requested Android SDK packages are already installed in $sdk\"\nfi"
        },
        {
          "name": "Verify Gradle wrapper",
          "run": "echo \"7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar\" | sha256sum -c -"
        },
        {
          "name": "Run checks",
          "run": "python scripts/check_repository.py\npython -m pip install -r scripts/privacy_traffic/requirements.txt\npython scripts/quality_gates.py ci\npython scripts/quality_gates.py self-test\npython scripts/privacy_traffic_harness.py self-test --all-scripts\npython scripts/check_privacy_components.py"
        }
      ]
    }
  }
}
